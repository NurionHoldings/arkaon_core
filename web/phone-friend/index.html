<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ARKAON 폰친구</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="shell">
    <header class="brand-block">
      <p class="brand">ARKAON</p>
      <h1 class="product">폰친구</h1>
      <p class="tagline">말하면 이해하고, 필요할 때만 확인받고, 안전하게 도와줘요.</p>
    </header>

    <section class="presence" aria-label="아르카온 상태">
      <div class="orb" id="orb" data-mood="LISTENING" data-status="IDLE">
        <span class="orb-core"></span>
        <span class="orb-ring"></span>
      </div>
      <p class="presence-label" id="presenceLabel">마이크를 눌러 말해 보세요.</p>
      <p class="presence-status" id="statusBadge">마이크를 눌러 말해 보세요.</p>
      <div class="progress-panel" id="progressPanel" hidden></div>
    </section>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <form class="composer" id="composer">
      <label class="sr-only" for="utterance">메시지</label>
      <input
        id="utterance"
        name="utterance"
        type="text"
        autocomplete="off"
        placeholder="말하거나 입력해 보세요"
      />
      <button type="button" id="micBtn" class="mic" aria-label="음성으로 말하기" title="음성으로 말하기">
        <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </button>
      <button type="submit" id="sendBtn">보내기</button>
    </form>

    <p class="hint">마이크를 누르면 말할 수 있어요 · 예: 연락처 중복 찾아줘</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
